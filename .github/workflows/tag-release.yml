name: Tag release
on:
  push:
    branches:
      - main
permissions:
  contents: write # push the version tag
jobs:
  tag:
    name: Tag version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the version in version.py if it has no tag yet
        run: |
          version=$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' version.py)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read a major.minor.patch version from version.py"
            exit 1
          fi

          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag already exists, nothing to tag"
            exit 0
          fi

          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Tagged $tag at $GITHUB_SHA"
