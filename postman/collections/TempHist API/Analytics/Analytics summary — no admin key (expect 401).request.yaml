$kind: http-request
description: Auth check — analytics reads are admin-only, so this should fail without X-Admin-Key.
url: "{{baseURL}}/analytics/summary"
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Rejected with 401', () => pm.response.to.have.status(401));
order: 2500
